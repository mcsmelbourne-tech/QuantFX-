name: QuantFX Hourly Scan

on:
  schedule:
    # Runs at minute 0 of every hour (UTC). Adjust to your market hours
    # to avoid wasted runs outside trading sessions, e.g. this example
    # runs on the hour, Mon-Fri only, 00:00-23:00 UTC.
    - cron: "0 * * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_WIDE_UNIVERSE: "true"
        run: python run_scan.py
